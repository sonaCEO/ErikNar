[project]
name = "eriknar-backend"
version = "0.1.0"
description = "Backend API and Telegram integration for ErikNar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1",
  "minio>=7.2,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eriknar"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eriknar"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
