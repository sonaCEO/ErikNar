# Per-IP request limits. Protects the backend from flooding through the
# public edge — without these, anyone can hammer the lead form or the
# live-dependency health check and load Postgres/MinIO into the ground.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_ready:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=leads_form:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=media_upload:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live Postgres + MinIO probe on every call — cheap to flood, expensive
    # to serve. Kept reachable for external uptime checks, just throttled hard.
    location = /api/v1/ready {
        limit_req zone=api_ready burst=2 nodelay;
        proxy_pass http://api:8000/api/v1/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public, unauthenticated lead-creation form.
    location = /api/v1/leads {
        limit_req zone=leads_form burst=3 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api:8000/api/v1/leads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin media upload — requires a valid admin token, but still worth
    # capping independently of the general admin traffic rate.
    location ~ ^/api/v1/admin/catalog/products/[^/]+/media$ {
        limit_req zone=media_upload burst=5 nodelay;
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
